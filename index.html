<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KitStack.org — Free Browser Tools by Twilight Surfers</title>
    <meta name="description" content="Free Build Tools @ KitStack — Twilight Surfers browser utilities for color palettes, CSS shadows, JSON inspection, responsive units, and more. No accounts. No backend required." />
    <meta property="og:title" content="KitStack.org — Free Browser Tools by Twilight Surfers" />
    <meta property="og:description" content="Free Build Tools @ KitStack — Twilight Surfers browser utilities for color palettes, CSS shadows, JSON inspection, responsive units, and more. No accounts. No backend required." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Synchronous Theme Bootstrap to guarantee zero-FOUC / no screen flash -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('kitstack_settings');
          var theme = 'dark';
          var accent = '#4F46E5';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.theme) theme = parsed.theme;
            if (parsed && parsed.accentColor) accent = parsed.accentColor;
          }
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }

          // Parse RGB for synchronous CSS variable setting
          var clean = accent.replace('#', '');
          if (clean.length === 3) clean = clean.split('').map(function(c) { return c + c; }).join('');
          var num = parseInt(clean, 16);
          if (!isNaN(num)) {
            var r = (num >> 16) & 255;
            var g = (num >> 8) & 255;
            var b = num & 255;
            var lum = (r * 0.2126 + g * 0.7152 + b * 0.0722) / 255;
            root.style.setProperty('--theme-accent', accent);
            root.style.setProperty('--theme-accent-contrast', lum > 0.45 ? '#0a0a0a' : '#ffffff');
            root.style.setProperty('--theme-accent-subtle', 'rgba(' + r + ',' + g + ',' + b + ',' + (isDark ? 0.2 : 0.12) + ')');
            root.style.setProperty('--theme-accent-border', 'rgba(' + r + ',' + g + ',' + b + ',' + (isDark ? 0.45 : 0.35) + ')');
            root.style.setProperty('--theme-accent-ring', 'rgba(' + r + ',' + g + ',' + b + ',0.45)');
          }
        } catch (e) {}
      })();
    </script>
    <script defer src="https://analytics.mavenmvp.com/script.js" data-website-id="e86571a2-3f98-4a7c-870c-82d537a1822a"></script>
  </head>
  <body class="bg-neutral-100 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
